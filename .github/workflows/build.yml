name: App Patcher Automation Engine

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: 'Direct package download URL (.apk, .apks, .apkm, .xapk, .apk+)'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  patch-and-build:
    name: Build & Patch Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Required Binary Tooling
        run: |
          mkdir -p bin/tools
          if [ ! -f bin/tools/APKEditor.jar ]; then
            echo "Downloading REAndroid APKEditor tool..."
            curl -fL -A "Mozilla/5.0" -o bin/tools/APKEditor.jar "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"
          fi

      - name: Download Target Package
        run: |
          mkdir -p workspace/input
          PACKAGE_URL="${{ github.event.inputs.package_url }}"
          if [ -n "$PACKAGE_URL" ]; then
            echo "Downloading input package from: $PACKAGE_URL"
            curl -fL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o workspace/input/target_package.apkm "$PACKAGE_URL"
            ls -lh workspace/input/
          fi

      - name: Compile Patch Definitions
        run: |
          python patch_builder.py

      - name: Execute Patching Pipeline
        run: |
          if [ -f workspace/input/target_package.apkm ] && [ -s workspace/input/target_package.apkm ]; then
            python porter.py --verbose
          elif [ -n "$(ls -A workspace/input/*.apk workspace/input/*.apks workspace/input/*.apkm workspace/input/*.xapk workspace/input/*.apk+ 2>/dev/null)" ]; then
            python porter.py --verbose
          else
            echo "No input package detected. Executing validation dry-run..."
            python porter.py --verbose --dry-run
          fi

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ported-standalone-apk
          path: workspace/output/*.apk
          if-no-files-found: error
